replicaCount: 2

image:
  repository: 'ghcr.io/epitechmscpropromo2026/t-clo-902-nan_2/sample-app'
  pullPolicy: IfNotPresent
  tag: 'latest'

imagePullSecrets: []

ingress:
  enabled: false

httpRoute:
  enabled: true
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway-system
  hostnames:
    - 'sample-app.example.com'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sample-app
          port: 80
          weight: 100

service:
  type: ClusterIP
  port: 80

autoscaling:
  enabled: false
serviceAccount:
  create: true

app:
  env: 'production'
  debug: false
  key: ''

database:
  host: 't-clo-902-db-cluster'
  name: 'laravel'
  user: 'sample_app_user'
  password: ''
