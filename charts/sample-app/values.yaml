replicaCount: 2

image:
  repository: "ghcr.io/epitechmscpropromo2026/t-clo-902-nan_1/sample-app"
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets:
  - name: ghcr-registry

ingress:
  enabled: false

httpRoute:
  enabled: true
  publicAddress: ""
  hostnames:
    - app.15-237-15-14.nip.io
  parentRefs:
    - name: public-gateway
      namespace: traefik-system
      sectionName: websecure

service:
  type: ClusterIP
  port: 80

autoscaling:
  enabled: true
  targetCPUUtilizationPercentage: 70
  minReplicas: 2
  maxReplicas: 5

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: sample-app
        topologyKey: kubernetes.io/hostname

serviceAccount:
  create: true

app:
  env: "production"
  debug: false
  key: ""

database:
  host: ""
  name: "laravel"
  user: "sample_app_user"
  password: ""
  backup:
    enabled: true
    schedule: "0 2 * * *"
    retentionDays: 7
    storage: 5Gi

secrets:
  useSealedSecrets: false
  scope: "strict"
  encryptedData:
    appKey: ""
    dbPassword: ""