replicaCount: 2

image:
  repository: "ghcr.io/epitechmscpropromo2026/t-clo-902-nan_1/sample-app"
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

registry:
  dockerconfigjson: ""

ingress:
  enabled: false

httpRoute:
  enabled: true
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway-system

service:
  type: ClusterIP
  port: 80

autoscaling:
  enabled: false

serviceAccount:
  create: true


app:
  env: "production"
  debug: false
  key: ""

database:
  host: ""
  name: "laravel"
  user: "sample_app_user"
  password: ""
  backup:
    enabled: true
    schedule: "0 2 * * *"
    retentionDays: 7
    storage: 5Gi

secrets:
  useSealedSecrets: false
  scope: "strict"
  encryptedData:
    appKey: ""
    dbPassword: ""