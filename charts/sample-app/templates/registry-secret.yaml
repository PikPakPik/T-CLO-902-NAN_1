{{- if .Values.registry.dockerconfigjson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sample-app.fullname" . }}-registry
  labels: {{ include "sample-app.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.registry.dockerconfigjson | quote }}
{{- end }}
