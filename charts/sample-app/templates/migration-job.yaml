apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sample-app.fullname" . }}-migration
  labels:
    {{ include "sample-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  template:
    metadata:
      labels:
        {{ include "sample-app.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sample-app.serviceAccountName" . }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ .Values.database.host | default (printf "%s-mysql" (include "sample-app.fullname" .)) }} 3306; do
                echo "En attente de la base de données...";
                sleep 5;
              done
      containers:
        - name: laravel-migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - php
            - artisan
            - migrate
            - --force
          env:
            - name: APP_ENV
              value: {{ .Values.app.env | default "production" | quote }}
            - name: DB_HOST
              value: {{ .Values.database.host | default (printf "%s-mysql" (include "sample-app.fullname" .)) | quote }}
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: {{ .Values.database.name | default "laravel" | quote }}
            - name: DB_USERNAME
              value: {{ .Values.database.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: db-password
                  name: {{ include "sample-app.fullname" . }}-app-secrets
