apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sample-app.fullname" . }}-mysql
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sample-app.fullname" . }}-mysql
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ include "sample-app.fullname" . }}-mysql
  template:
    metadata:
      labels:
        app: {{ include "sample-app.fullname" . }}-mysql
    spec:
      nodeSelector:
        kubequest/role: database
      containers:
        - name: mysql
          image: "mysql:8.0"
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sample-app.fullname" . }}-app-secrets
                  key: db-password
            - name: MYSQL_DATABASE
              value: {{ .Values.database.name | default "laravel" | quote }}
            - name: MYSQL_USER
              value: {{ .Values.database.user | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sample-app.fullname" . }}-app-secrets
                  key: db-password
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: {{ include "sample-app.fullname" . }}-mysql
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sample-app.fullname" . }}-mysql
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: {{ include "sample-app.fullname" . }}-mysql
