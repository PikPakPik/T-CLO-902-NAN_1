{{- if .Values.secrets.useSealedSecrets }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "sample-app.fullname" . }}-app-secrets
  labels: {{ include "sample-app.labels" . | nindent 4 }}
  {{- if eq .Values.secrets.scope "namespace-wide" }}
  annotations:
    sealedsecrets.bitnami.com/namespace-wide: "true"
  {{- else if eq .Values.secrets.scope "cluster-wide" }}
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
  {{- end }}
spec:
  encryptedData:
    app-key: {{ required "secrets.encryptedData.appKey is required when secrets.useSealedSecrets=true" .Values.secrets.encryptedData.appKey | quote }}
    db-password: {{ required "secrets.encryptedData.dbPassword is required when secrets.useSealedSecrets=true" .Values.secrets.encryptedData.dbPassword | quote }}
  template:
    metadata:
      name: {{ include "sample-app.fullname" . }}-app-secrets
      labels: {{ include "sample-app.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
