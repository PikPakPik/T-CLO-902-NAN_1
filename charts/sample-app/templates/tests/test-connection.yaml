apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "sample-app.fullname" . }}-test-connection"
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "sample-app.fullname" . }}:{{ .Values.service.port }}']
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  restartPolicy: Never
