{{- if .Values.database.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "sample-app.fullname" . }}-mysql-backup
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: {{ .Values.database.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sample-app.fullname" . }}-mysql-backup
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.database.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "sample-app.fullname" . }}-mysql-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: mysql-backup
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubequest/role: database
          containers:
            - name: backup
              image: "mysql:8.0"
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                - name: MYSQL_HOST
                  value: {{ .Values.database.host | default (printf "%s-mysql" (include "sample-app.fullname" .)) | quote }}
                - name: MYSQL_DATABASE
                  value: {{ .Values.database.name | default "laravel" | quote }}
                - name: MYSQL_USER
                  value: {{ .Values.database.user | quote }}
                - name: MYSQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "sample-app.fullname" . }}-app-secrets
                      key: db-password
                - name: RETENTION_DAYS
                  value: {{ .Values.database.backup.retentionDays | quote }}
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  BACKUP_DIR=/backups
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  FILENAME="${BACKUP_DIR}/${MYSQL_DATABASE}_${TIMESTAMP}.sql.gz"
                  echo "Démarrage du backup vers ${FILENAME}..."
                  export MYSQL_PWD="${MYSQL_PASSWORD}"
                  mysqldump \
                    -h "${MYSQL_HOST}" \
                    -u "${MYSQL_USER}" \
                    --single-transaction \
                    --routines \
                    --triggers \
                    "${MYSQL_DATABASE}" | gzip > "${FILENAME}"
                  unset MYSQL_PWD
                  echo "Backup terminé : ${FILENAME} ($(du -h "${FILENAME}" | cut -f1))"
                  echo "Suppression des backups de plus de ${RETENTION_DAYS} jours..."
                  find "${BACKUP_DIR}" -name "*.sql.gz" -mtime +"${RETENTION_DAYS}" -delete
              volumeMounts:
                - name: backup-data
                  mountPath: /backups
          volumes:
            - name: backup-data
              persistentVolumeClaim:
                claimName: {{ include "sample-app.fullname" . }}-mysql-backup
{{- end }}
