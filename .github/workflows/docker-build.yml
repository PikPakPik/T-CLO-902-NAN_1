name: Build Docker Image

on:
  push:
    branches:
      - '**'
    paths:
      - 'resources/sample-app-master/Dockerfile'
      - 'resources/sample-app-master/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${OWNER}/${REPO}/sample-app"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT
          echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          EFFECTIVE_REF="${{ github.event.inputs.branch && format('refs/heads/{0}', github.event.inputs.branch) || github.ref }}"
          if [ "${EFFECTIVE_REF}" = "refs/heads/main" ]; then
            echo "tag=${IMAGE_BASE}:${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "rollback_tag=${IMAGE_BASE}:rollback-demo" >> $GITHUB_OUTPUT
          else
            echo "tag=${IMAGE_BASE}:${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "rollback_tag=${IMAGE_BASE}:${SHORT_SHA}-rollback-demo" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./resources/sample-app-master
          file: ./resources/sample-app-master/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.tag }}

      - name: Build and push rollback-demo image
        uses: docker/build-push-action@v7
        with:
          context: ./resources/sample-app-master
          file: ./resources/sample-app-master/Dockerfile
          target: rollback-demo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.rollback_tag }}

  update-gitops:
    name: Update GitOps values
    runs-on: self-hosted
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.branch == 'main' || github.event.inputs.branch == ''))
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Update gitops/sample-app/values.yaml
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          {
            echo "# Values de déploiement — source de vérité GitOps (sans ArgoCD)."
            echo "# Mis à jour automatiquement par la CI après chaque build Docker sur main."
            echo ""
            echo "image:"
            echo "  tag: \"${SHORT_SHA}\""
            echo "  pullPolicy: IfNotPresent"
            echo ""
            echo "podAnnotations:"
            echo "  kubequest.io/git-sha: \"${SHORT_SHA}\""
          } > gitops/sample-app/values.yaml

      - name: Commit and push GitOps values
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/sample-app/values.yaml
          if git diff --staged --quiet; then
            echo "Aucun changement GitOps à committer."
            exit 0
          fi
          git commit -m "chore(gitops): deploy sample-app ${GITHUB_SHA:0:12}"
          git push