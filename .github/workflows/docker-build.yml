name: Build Docker Image

on:
  push:
    branches:
      - '*'
    paths:
      - 'resources/sample-app-master/Dockerfile'
      - 'resources/sample-app-master/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_BASE="ghcr.io/${OWNER}/${REPO}/sample-app"
          echo "owner=${OWNER}" >> $GITHUB_OUTPUT
          echo "image_base=${IMAGE_BASE}" >> $GITHUB_OUTPUT
          EFFECTIVE_REF="${{ github.event.inputs.branch && format('refs/heads/{0}', github.event.inputs.branch) || github.ref }}"
          if [ "${EFFECTIVE_REF}" = "refs/heads/main" ]; then
            echo "tag=${IMAGE_BASE}:latest" >> $GITHUB_OUTPUT
            echo "rollback_tag=${IMAGE_BASE}:rollback-demo" >> $GITHUB_OUTPUT
          else
            COMMIT=$(echo "${{ github.sha }}" | cut -c1-12)
            echo "tag=${IMAGE_BASE}:${COMMIT}" >> $GITHUB_OUTPUT
            echo "rollback_tag=${IMAGE_BASE}:${COMMIT}-rollback-demo" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./resources/sample-app-master
          file: ./resources/sample-app-master/Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.tag }}

      - name: Build and push rollback-demo image
        uses: docker/build-push-action@v7
        with:
          context: ./resources/sample-app-master
          file: ./resources/sample-app-master/Dockerfile
          target: rollback-demo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.rollback_tag }}