name: Build Docker Image

on:
  push:
    branches:
      - '*'
    paths:
      - 'ressource/sample-app-master/Dockerfile'
      - 'ressource/sample-app-master/**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=ghcr.io/${OWNER}/sample-app:latest" >> $GITHUB_OUTPUT
          else
            COMMIT=$(echo "${{ github.sha }}" | cut -c1-12)
            echo "tag=ghcr.io/${OWNER}/sample-app:${COMMIT}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./ressource/sample-app-master
          file: ./ressource/sample-app-master/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.tag }}