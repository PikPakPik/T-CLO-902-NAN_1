name: Tester la connectivité des instances EC2

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  test-connectivity:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Validate manifests
        run: kubectl kustomize infra/headlamp/

  deploy:
    runs-on: self-hosted
    environment: deployment
    if: github.event_name == 'push'
    needs: test-connectivity
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/kubequest.pem
          chmod 600 ~/.ssh/kubequest.pem

      - name: Test connectivity to EC2 instances
        run: |
          cd ansible
          ansible-playbook -i inventory.yml test_connectivity.yml
