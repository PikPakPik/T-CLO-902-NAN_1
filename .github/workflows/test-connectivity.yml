name: CI - Validate and deploy infrastructure

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'infra/**'
      - '.github/workflows/test-connectivity.yml'
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'infra/**'
      - '.github/workflows/test-connectivity.yml'

jobs:
  validate:
    name: Validate manifests and connectivity playbook
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'
      
      - name: Set up Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Validate manifests
        run: kubectl kustomize infra/headlamp/

      - name: Validate Ansible syntax
        run: ansible-playbook -i ansible/inventory.yml ansible/test_connectivity.yml --syntax-check

  aws:
    name: Run connectivity test on EC2
    runs-on: self-hosted
    environment: deployment
    if: github.event_name != 'pull_request'
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/kubequest.pem
          chmod 600 ~/.ssh/kubequest.pem

      - name: Test connectivity to EC2 instances
        run: |
          ansible-playbook -i ansible/inventory.yml ansible/test_connectivity.yml
