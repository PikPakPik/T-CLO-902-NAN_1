name: Update EC2 via SSH

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  update-ec2:
    runs-on: self-hosted
    environment: deployment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ANSIBLE_SSH_KEY }}" > ~/.ssh/kubequest.pem
          chmod 600 ~/.ssh/kubequest.pem

      - name: Update EC2 instance
        run: |
          cd ansible
          ansible-playbook -i inventory.yml test_connectivity.yml