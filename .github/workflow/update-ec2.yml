name: Tester la connectivité des instances EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-connectivity:
    runs-on: self-hosted
    environment: deployment
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/kubequest.pem
          chmod 600 ~/.ssh/kubequest.pem

      - name: Test connectivity to EC2 instances
        run: |
          cd ansible
          ansible-playbook -i inventory.yml test_connectivity.yml