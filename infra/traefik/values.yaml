---
providers:
  kubernetesGateway:
    enabled: true

ports:
  web:
    port: 80
    expose:
      default: true
    protocol: TCP
  websecure:
    port: 443
    expose:
      default: true
    protocol: TCP
  traefik:
    port: 8000
    expose:
      default: true
    protocol: TCP
  metrics:
    port: 9101
    expose:
      default: true
    protocol: TCP

service:
  enabled: false

updateStrategy:
  type: Recreate
  rollingUpdate: null


hostNetwork: true
nodeSelector:
  kubernetes.io/hostname: ip-10-0-3-214.eu-west-3.compute.internal
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists

securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  capabilities:
    add:
      - NET_BIND_SERVICE
