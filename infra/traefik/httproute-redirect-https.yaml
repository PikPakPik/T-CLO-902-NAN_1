apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-https
  namespace: traefik-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: kubequest
spec:
  # Attachée uniquement au listener HTTP (port 80)
  parentRefs:
    - name: public-gateway
      namespace: traefik-system
      sectionName: web
  # Pas de hostnames ni de match : catch-all sur tout le trafic HTTP.
  # Les HTTPRoutes ACME créées par cert-manager (/.well-known/acme-challenge/...)
  # ont un path plus spécifique et priment sur ce catch-all (précédence Gateway API).
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301