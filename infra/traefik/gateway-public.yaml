apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: traefik-system
spec:
  gatewayClassName: traefik
  listeners:
    # Entrypoint HTTP sur port 80
    - name: web
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All  # Permet aux routes de tous les namespaces de s'y brancher
    
    - name: websecure
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: apps-tls