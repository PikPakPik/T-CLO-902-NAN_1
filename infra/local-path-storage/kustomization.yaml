apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - service-account.yaml
  - role.yaml
  - cluster-role.yaml
  - role-binding.yaml
  - cluster-role-binding.yaml
  - deployment.yaml
  - storage-class.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: local-path-provisioner
      namespace: local-path-storage
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: ip-10-0-3-198.eu-west-3.compute.internal

  - target:
      group: storage.k8s.io
      version: v1
      kind: StorageClass
      name: local-path
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
