apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
  namespace: dex
  labels:
    app.kubernetes.io/name: dex
    app.kubernetes.io/part-of: kubequest
spec:
  parentRefs:
    - name: public-gateway
      namespace: traefik-system
      sectionName: websecure
  hostnames:
    - dex.15-237-15-14.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Service créé par le chart dex/dex (release: dex)
        - name: dex
          port: 5556
          weight: 100
