---
replicaCount: 1

nodeSelector:
  kubernetes.io/hostname: ip-10-0-3-187.eu-west-3.compute.internal

config:
  issuer: "https://dex.15-237-15-14.nip.io"

  storage:
    type: memory

  web:
    http: "0.0.0.0:5556"

  oauth2:
    skipApprovalScreen: true

  enablePasswordDB: true

  staticPasswords:
    - email: "admin@kubequest.local"
      hashFromEnv: ADMIN_PASSWORD_HASH
      username: "admin"
      userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
      
    - email: "user@kubequest.local"
      hashFromEnv: USER_PASSWORD_HASH
      username: "user"
      userID: "1d2f3a4b-5c6d-4e8f-9a0b-1c2d3e4f5a6b"

  staticClients:
    - id: "grafana"
      name: Grafana
      secretEnv: GRAFANA_CLIENT_SECRET
      redirectURIs:
        - "https://grafana.15-237-15-14.nip.io/login/generic_oauth"

    - id: "headlamp"
      name: Headlamp
      secretEnv: HEADLAMP_CLIENT_SECRET
      redirectURIs:
        - "https://headlamp.15-237-15-14.nip.io/oidc-callback"

    - id: "argocd"
      name: ArgoCD
      secretEnv: ARGOCD_CLIENT_SECRET
      redirectURIs:
        - "https://argocd.15-237-15-14.nip.io/auth/callback"

  connectors:
    - type: oidc
      id: microsoft
      name: Microsoft
      config:
        issuer: "https://login.microsoftonline.com/901cb4ca-b862-4029-9306-e5cd0f6d9f86/v2.0"
        clientID: "f6a9fec6-8fae-4e88-8c6b-0c08c2a9ac87"
        clientSecret: $MICROSOFT_CLIENT_SECRET
        redirectURI: "https://dex.15-237-15-14.nip.io/callback"
        scopes:
          - openid
          - profile
          - email
        insecureSkipEmailVerified: true
        getUserInfo: false
        claimMapping:
          groups: "groups"

envFrom:
  - secretRef:
      name: "dex-secrets"

service:
  type: ClusterIP
  ports:
    http:
      port: 5556
      targetPort: http
      