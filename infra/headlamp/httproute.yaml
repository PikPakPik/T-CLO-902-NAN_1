apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: kubequest
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: Exact
            value: /headlamp
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /headlamp/
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /headlamp/
      backendRefs:
        - name: headlamp
          port: 80
          weight: 100
