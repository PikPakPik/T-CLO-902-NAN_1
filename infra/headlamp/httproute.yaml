apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: kubequest
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway-system
  hostnames:
    # nip.io = DNS magique qui résout *.X.X.X.X.nip.io vers l'IP X.X.X.X
    # Idéal pour test/démo sans configurer de DNS réel.
    # En production : remplacer par un vrai domaine (ex: headlamp.kubequest.com)
    # avec un CNAME pointant vers le LoadBalancer AWS.
    - headlamp.15.237.15.14.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
          weight: 100
