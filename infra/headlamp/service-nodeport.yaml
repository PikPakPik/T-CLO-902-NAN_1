# TODO: remplacer par une HTTPRoute une fois nginx-gateway-fabric déployé
apiVersion: v1
kind: Service
metadata:
  name: headlamp-nodeport
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
    app.kubernetes.io/part-of: kubequest
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: headlamp
  ports:
    - port: 80
      targetPort: 4466
      nodePort: 30080