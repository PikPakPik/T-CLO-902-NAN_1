apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kubequest
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: Exact
            value: /grafana
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /grafana/
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /grafana/
      backendRefs:
        # Service créé par kube-prometheus-stack (release: kube-prometheus)
        - name: kube-prometheus-grafana
          port: 80
          weight: 100
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kubequest
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: Exact
            value: /prometheus
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /prometheus/
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /prometheus/
      backendRefs:
        - name: kube-prometheus-kube-prometheus-prometheus
          port: 9090
          weight: 100
