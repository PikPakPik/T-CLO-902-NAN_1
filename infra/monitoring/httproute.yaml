apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kubequest
spec:
  parentRefs:
    - name: public-gateway
      namespace: traefik-system
  hostnames:
    - grafana.15-237-15-14.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Service créé par kube-prometheus-stack (release: kube-prometheus)
        - name: kube-prometheus-grafana
          port: 80
          weight: 100
# Prometheus n'est volontairement PAS exposé via le Gateway public (aucune authentification).
# Accès interne uniquement : kubectl port-forward -n monitoring \
#   svc/kube-prometheus-kube-prome-prometheus 9090:9090
