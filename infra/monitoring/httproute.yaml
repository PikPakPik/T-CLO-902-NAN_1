apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: kubequest
spec:
  parentRefs:
    - name: public-gateway
      namespace: traefik-system
  hostnames:
    - grafana.15-237-15-14.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Service créé par kube-prometheus-stack (release: kube-prometheus)
        - name: kube-prometheus-grafana
          port: 80
          weight: 100
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kubequest
spec:
  parentRefs:
    - name: public-gateway
      namespace: traefik-system
  hostnames:
    - prometheus.15-237-15-14.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kube-prometheus-kube-prome-prometheus
          port: 9090
          weight: 100
