---
# Configuration ArgoCD
# ConfigMap pour le serveur
configs:
  params:
    server.insecure: true


  cm:
    url: https://argocd.15-237-15-14.nip.io
    
    oidc.config: |
      name: Dex
      issuer: https://dex.15-237-15-14.nip.io
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups

  
  rbac:
    policy.default: role:readonly
    scopes: "[email, groups]"
    policy.csv: |
      g, admin@kubequest.local, role:admin

dex:
  enabled: false

# Ressources recommandées pour un environnement de test
controller:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

redis:
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

repoServer:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

server:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP
  # Désactiver l'ingress automatique, nous utiliserons HTTPRoute
  ingress:
    enabled: false
