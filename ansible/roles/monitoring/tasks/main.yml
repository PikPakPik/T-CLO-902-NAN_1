---
- name: "[MONITORING] Vérifier que kubectl est disponible"
  command: kubectl version --client=true
  changed_when: false

- name: "[MONITORING] Vérifier que Helm est disponible"
  command: helm version
  register: helm_version
  failed_when: false
  changed_when: false

- name: "[MONITORING] Installer Helm (si absent)"
  when: helm_version.rc != 0
  block:
    - name: "[MONITORING] Télécharger le script d'installation Helm"
      get_url:
        url: "https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3"
        dest: /tmp/get-helm-3
        mode: "0755"

    - name: "[MONITORING] Exécuter l'installation Helm"
      command: /tmp/get-helm-3

- name: "[MONITORING] Vérifier si la StorageClass {{ monitoring_storage_class }} existe déjà"
  shell: |
    KUBECONFIG="{{ k8s_master_config }}" kubectl get storageclass {{ monitoring_storage_class }} -o name
  args:
    executable: /bin/bash
  register: storageclass_check
  failed_when: false
  changed_when: false

- name: "[MONITORING] Installer local-path-provisioner (si StorageClass absente)"
  when: storageclass_check.rc != 0
  shell: |
    set -euo pipefail
    KUBECONFIG="{{ k8s_master_config }}" kubectl apply -f "{{ local_path_provisioner_manifest_url }}"
  args:
    executable: /bin/bash

- name: "[MONITORING] Attendre que local-path-provisioner soit Ready"
  when: storageclass_check.rc != 0
  shell: |
    set -euo pipefail
    KUBECONFIG="{{ k8s_master_config }}" kubectl -n local-path-storage \
      rollout status deploy/local-path-provisioner --timeout=180s
  args:
    executable: /bin/bash

- name: "[MONITORING] Marquer {{ monitoring_storage_class }} comme StorageClass par défaut"
  shell: |
    set -euo pipefail
    KUBECONFIG="{{ k8s_master_config }}" kubectl patch storageclass {{ monitoring_storage_class }} \
      -p '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
  args:
    executable: /bin/bash
  register: default_sc_patch
  changed_when: "'patched' in default_sc_patch.stdout and 'no change' not in default_sc_patch.stdout"

- name: "[MONITORING] Ajouter le repo Helm {{ monitoring_chart_repo_name }}"
  command: helm repo add {{ monitoring_chart_repo_name }} {{ monitoring_chart_repo_url }}
  register: helm_repo_add
  failed_when: helm_repo_add.rc != 0 and ('already exists' not in (helm_repo_add.stderr | default('')))
  changed_when: "'already exists' not in (helm_repo_add.stderr | default(''))"

- name: "[MONITORING] Mettre à jour les repos Helm"
  command: helm repo update
  changed_when: false

- name: "[MONITORING] Récupérer le nom du noeud control-plane"
  shell: |
    set -euo pipefail
    KUBECONFIG="{{ k8s_master_config }}" kubectl get nodes \
      -l node-role.kubernetes.io/control-plane \
      -o jsonpath='{.items[0].metadata.name}'
  args:
    executable: /bin/bash
  register: monitoring_master_node_query
  changed_when: false

- name: "[MONITORING] Définir monitoring_master_node_name"
  set_fact:
    monitoring_master_node_name: "{{ monitoring_master_node_query.stdout | trim }}"

- name: "[MONITORING] Créer le répertoire des values Helm sur le master"
  file:
    path: /tmp/kubequest/monitoring
    state: directory
    mode: "0755"

- name: "[MONITORING] Générer les values Helm sur le master"
  template:
    src: values.yaml.j2
    dest: /tmp/kubequest/monitoring/values.yaml
    mode: "0644"

- name: "[MONITORING] Installer / mettre à jour kube-prometheus-stack via Helm"
  shell: |
    set -euo pipefail
    KUBECONFIG="{{ k8s_master_config }}" \
      helm upgrade --install {{ monitoring_release_name }} {{ monitoring_chart_name }} \
        --namespace {{ monitoring_namespace }} \
        --create-namespace \
        --version {{ monitoring_chart_version }} \
        --values /tmp/kubequest/monitoring/values.yaml \
        --wait --timeout 10m
  args:
    executable: /bin/bash

- name: "[MONITORING] État des pods / services / PVC du namespace"
  shell: |
    set -euo pipefail
    KUBECONFIG="{{ k8s_master_config }}" kubectl get pods,svc,pvc -n {{ monitoring_namespace }} -o wide
  args:
    executable: /bin/bash
  register: monitoring_status
  changed_when: false