---
monitoring_kustomize_src: "{{ playbook_dir }}/../infra/monitoring"

monitoring_namespace: monitoring
monitoring_release_name: kube-prometheus
monitoring_chart_repo_name: prometheus-community
monitoring_chart_repo_url: https://prometheus-community.github.io/helm-charts
monitoring_chart_version: "85.0.3"

# Identifiants admin Grafana : fournis via un SealedSecret (aucun mot de passe en clair ici).
# Le contrôleur Sealed Secrets déchiffre infra/monitoring/grafana-sealedsecret.yaml en un Secret
# référencé par Grafana (grafana.admin.existingSecret).
# Génération : scripts/seal-grafana-secret.sh (voir docs/sealed-secrets.md).
grafana_admin_secret_name: grafana-admin-credentials

# StorageClass utilisée par le PVC Prometheus. Doit exister avant l'install.
monitoring_storage_class: local-path
monitoring_prometheus_pvc_size: 20Gi
monitoring_prometheus_retention: 15d

# Hostnames nip.io (HTTPRoute dédié par service, path /)
monitoring_nip_suffix: "{{ master_public_ip | replace('.', '-') }}.nip.io"
monitoring_grafana_hostname: "grafana.{{ monitoring_nip_suffix }}"
monitoring_prometheus_hostname: "prometheus.{{ monitoring_nip_suffix }}"

# local-path-provisioner (Rancher) — installé si la StorageClass n'existe pas.
local_path_provisioner_manifest_url: "https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.36/deploy/local-path-storage.yaml"
local_path_provisioner_rollout_timeout: 300s