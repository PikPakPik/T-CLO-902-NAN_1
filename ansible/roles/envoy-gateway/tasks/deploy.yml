---
- name: "[ENVOY] Créer la GatewayClass"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_master_config }}"
    state: present
    definition:
      apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata:
        name: envoy-gateway
      spec:
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
        description: Envoy Gateway controller

- name: "[ENVOY] Attendre que le Gateway soit programmé"
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k8s_master_config }}"
    kubectl wait --timeout=3m -n {{ gateway_namespace }} gateway/{{ gateway_name }} --for=condition=Programmed || true
  args:
    executable: /bin/bash

- name: "[ENVOY] Installer nginx"
  ansible.builtin.yum:
    name: nginx
    state: present

- name: "[ENVOY] Récupérer le nom du Service LoadBalancer Envoy"
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k8s_master_config }}"
    kubectl get svc -n {{ gateway_namespace }} \
      -o jsonpath='{.items[?(@.spec.type=="LoadBalancer")].metadata.name}'
  args:
    executable: /bin/bash
  register: envoy_svc_name
  changed_when: false

- name: "[ENVOY] Récupérer le NodePort HTTP (port 80) d'Envoy"
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k8s_master_config }}"
    kubectl get svc -n {{ gateway_namespace }} {{ envoy_svc_name.stdout }} \
      -o jsonpath='{.spec.ports[?(@.port==80)].nodePort}'
  args:
    executable: /bin/bash
  register: envoy_node_port
  changed_when: false
  when: envoy_svc_name.stdout | length > 0

- name: "[ENVOY] Configurer nginx (reverse proxy vers NodePort Envoy)"
  ansible.builtin.copy:
    dest: /etc/nginx/conf.d/envoy-gateway.conf
    content: |
      server {
          listen 80 default_server;
          server_name _;
          location / {
              proxy_pass http://127.0.0.1:{{ envoy_node_port.stdout }};
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          }
      }
  when: envoy_node_port.stdout | length > 0

- name: "[ENVOY] Remplacer nginx.conf (éviter conflit sur le port 80)"
  ansible.builtin.copy:
    dest: /etc/nginx/nginx.conf
    content: |
      user nginx;
      worker_processes auto;
      error_log /var/log/nginx/error.log;
      pid /run/nginx.pid;
      include /usr/share/nginx/modules/*.conf;
      events {
          worker_connections 1024;
      }
      http {
          log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for"';
          access_log  /var/log/nginx/access.log  main;
          sendfile            on;
          tcp_nopush          on;
          keepalive_timeout   65;
          types_hash_max_size 4096;
          include             /etc/nginx/mime.types;
          default_type        application/octet-stream;
          include /etc/nginx/conf.d/*.conf;
      }

- name: "[ENVOY] Démarrer nginx"
  ansible.builtin.service:
    name: nginx
    state: restarted
    enabled: yes
