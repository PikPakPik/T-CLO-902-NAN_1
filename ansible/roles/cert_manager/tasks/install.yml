---
- name: '[CERT_MANAGER] Créer le répertoire des manifests cert-manager sur le master'
  ansible.builtin.file:
    path: /tmp/kubequest/infra/cert-manager
    state: directory
    mode: '0755'

- name: '[CERT_MANAGER] Copier les manifests cert-manager sur le master (depuis la machine de contrôle)'
  ansible.builtin.copy:
    src: '{{ cert_manager_kustomize_src }}/'
    dest: /tmp/kubequest/infra/cert-manager/
    mode: '0644'
    directory_mode: '0755'

- name: '[CERT_MANAGER] Installer cert-manager via Helm'
  kubernetes.core.helm:
    kubeconfig: '{{ k8s_master_config }}'
    name: cert-manager
    chart_ref: '{{ cert_manager_chart_repo }}'
    release_namespace: '{{ cert_manager_namespace }}'
    create_namespace: yes
    chart_version: '{{ cert_manager_chart_version }}'
    values_files:
      - /tmp/kubequest/infra/cert-manager/values.yaml


- name: '[CERT_MANAGER] Attendre que le Deployment cert-manager soit ready'
  ansible.builtin.shell: |
    export KUBECONFIG={{ k8s_master_config }}
    kubectl -n {{ cert_manager_namespace }} rollout status deploy/cert-manager --timeout=180s
  args:
    executable: /bin/bash
  changed_when: false
