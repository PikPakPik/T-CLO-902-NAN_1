---
- name: "[HEADLAMP] Résoudre le nom du node Kubernetes worker1"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_master_config }}"
    api_version: v1
    kind: Node
  register: headlamp_nodes
  changed_when: false

- name: "[HEADLAMP] Définir le node cible (worker1)"
  ansible.builtin.set_fact:
    headlamp_target_node_name: >-
      {{
        headlamp_nodes.resources
        | json_query("[?status.addresses[?address=='" + worker1_internal_ip + "']].metadata.name")
        | first
        | default('')
      }}

- name: "[HEADLAMP] Vérifier qu'on a trouvé le node Kubernetes cible"
  ansible.builtin.fail:
    msg: "Impossible de trouver le node Kubernetes correspondant à worker1 (ip={{ worker1_internal_ip }})"
  when: headlamp_target_node_name | length == 0

- name: "[HEADLAMP] Ajouter le repo Helm headlamp"
  ansible.builtin.command:
    argv:
      - helm
      - repo
      - add
      - headlamp
      - "{{ headlamp_chart_repo_url }}"
  register: headlamp_helm_repo_add
  failed_when: >-
    headlamp_helm_repo_add.rc != 0
    and ('already exists' not in (headlamp_helm_repo_add.stderr | default('')))
  changed_when: "'already exists' not in (headlamp_helm_repo_add.stderr | default(''))"

- name: "[HEADLAMP] Mettre à jour le cache des repos Helm"
  ansible.builtin.command: helm repo update
  changed_when: false

- name: "[HEADLAMP] Installer / mettre à jour Headlamp via Helm"
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_master_config }}"
    name: "{{ headlamp_release_name }}"
    chart_ref: "{{ headlamp_chart_ref }}"
    chart_repo_url: "{{ headlamp_chart_repo_url }}"
    release_namespace: "{{ headlamp_namespace }}"
    create_namespace: true
    update_repo_cache: false
    values:
      clusterRoleBinding:
        create: false
      config:
        baseURL: /headlamp
      nodeSelector:
        kubernetes.io/hostname: "{{ headlamp_target_node_name }}"

- name: "[HEADLAMP] Copier les manifests Kustomize sur le master"
  ansible.builtin.copy:
    src: "{{ headlamp_kustomize_src }}/"
    dest: /tmp/kubequest/infra/headlamp/
    mode: "0644"
    directory_mode: "0755"

- name: "[HEADLAMP] Générer le ClusterRole (Gateway API depuis group_vars/all.yml)"
  ansible.builtin.template:
    src: clusterrole.yaml.j2
    dest: /tmp/kubequest/infra/headlamp/clusterrole.yaml
    mode: "0644"

- name: "[HEADLAMP] Supprimer le ClusterRoleBinding existant (roleRef immuable)"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_master_config }}"
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: headlamp-admin
    state: absent

- name: "[HEADLAMP] Supprimer l'ancien Service NodePort"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_master_config }}"
    api_version: v1
    kind: Service
    name: headlamp-nodeport
    namespace: "{{ headlamp_namespace }}"
    state: absent

- name: "[HEADLAMP] Vérifier que les CRDs Gateway API (HTTPRoute) sont installées"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_master_config }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: httproutes.gateway.networking.k8s.io
  register: headlamp_httproute_crd
  failed_when: false

- name: "[HEADLAMP] Installer les CRDs Gateway API (prérequis HTTPRoute)"
  when: headlamp_httproute_crd.resources | default([]) | length == 0
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_master_config }}"
    src: "{{ gateway_api_crds_url }}"
    state: present

- name: "[HEADLAMP] Appliquer ServiceAccount, RBAC et HTTPRoute"
  ansible.builtin.shell: |
    set -euo pipefail
    KUBECONFIG="{{ k8s_master_config }}" kubectl apply -k /tmp/kubequest/infra/headlamp/
  args:
    executable: /bin/bash
