---
- name: "[HEADLAMP] Configurer les flags OIDC du kube-apiserver (confiance envers Dex)"
  ansible.builtin.import_tasks: apiserver-oidc.yml

- name: "[HEADLAMP] Ajouter le repo Helm headlamp"
  ansible.builtin.command:
    argv:
      - helm
      - repo
      - add
      - headlamp
      - "{{ headlamp_chart_repo_url }}"
  register: headlamp_helm_repo_add
  failed_when: >-
    headlamp_helm_repo_add.rc != 0
    and ('already exists' not in (headlamp_helm_repo_add.stderr | default('')))
  changed_when: "'already exists' not in (headlamp_helm_repo_add.stderr | default(''))"

- name: "[HEADLAMP] Mettre à jour le cache des repos Helm"
  ansible.builtin.command: helm repo update
  changed_when: false

- name: "[HEADLAMP] Créer le répertoire des manifests Headlamp sur le master"
  ansible.builtin.file:
    path: /tmp/kubequest/infra/headlamp
    state: directory
    mode: "0755"

- name: "[HEADLAMP] Copier les manifests Headlamp sur le master (depuis la machine de contrôle)"
  ansible.builtin.copy:
    src: "{{ headlamp_kustomize_src }}/"
    dest: /tmp/kubequest/infra/headlamp/
    mode: "0644"
    directory_mode: "0755"

- name: "[HEADLAMP] Créer le namespace {{ headlamp_namespace }} (avant le SealedSecret)"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_master_config }}"
    src: /tmp/kubequest/infra/headlamp/namespace.yaml
    state: present

- name: "[HEADLAMP] Appliquer le SealedSecret OIDC Headlamp/Dex (avant Helm)"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_master_config }}"
    src: /tmp/kubequest/infra/headlamp/headlamp-oidc-sealedsecret.yaml
    state: present

- name: "[HEADLAMP] Attendre que le Secret {{ headlamp_oidc_secret_name }} soit déchiffré"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_master_config }}"
    api_version: v1
    kind: Secret
    name: "{{ headlamp_oidc_secret_name }}"
    namespace: "{{ headlamp_namespace }}"
  register: headlamp_oidc_secret_info
  until: headlamp_oidc_secret_info.resources | default([]) | length > 0
  retries: 12
  delay: 5

- name: "[HEADLAMP] Installer / mettre à jour Headlamp via Helm"
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_master_config }}"
    name: "{{ headlamp_release_name }}"
    chart_ref: "{{ headlamp_chart_ref }}"
    chart_repo_url: "{{ headlamp_chart_repo_url }}"
    release_namespace: "{{ headlamp_namespace }}"
    create_namespace: true
    update_repo_cache: false
    values_files:
      - /tmp/kubequest/infra/headlamp/values.yaml

- name: "[HEADLAMP] Supprimer le ClusterRoleBinding existant (roleRef immuable)"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_master_config }}"
    api_version: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    name: headlamp-admin
    state: absent

- name: "[HEADLAMP] Supprimer l'ancien Service NodePort"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_master_config }}"
    api_version: v1
    kind: Service
    name: headlamp-nodeport
    namespace: "{{ headlamp_namespace }}"
    state: absent

- name: "[HEADLAMP] Vérifier que les CRDs Gateway API (HTTPRoute) sont installées"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_master_config }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: httproutes.gateway.networking.k8s.io
  register: headlamp_httproute_crd
  failed_when: false

- name: "[HEADLAMP] Installer les CRDs Gateway API (prérequis HTTPRoute)"
  when: headlamp_httproute_crd.resources | default([]) | length == 0
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_master_config }}"
    src: "{{ gateway_api_crds_url }}"
    state: present

- name: "[HEADLAMP] Appliquer ServiceAccount, RBAC et HTTPRoute"
  ansible.builtin.shell: |
    set -euo pipefail
    KUBECONFIG="{{ k8s_master_config }}" kubectl apply -k /tmp/kubequest/infra/headlamp/
  args:
    executable: /bin/bash
