---
- name: "Désactivation du swap"
  command: swapoff -a

- name: "Désactivation du swap au démarrage"
  lineinfile:
    path: /etc/fstab
    regexp: '^\s*[^#].*\bswap\b'
    state: absent
    backup: yes

- name: "Charger les modules du noyau nécessaires"
  modprobe:
    name: "{{ item }}"
    state: present
  with_items:
    - br_netfilter
    - overlay

- name: "Assurer que les modules du noyau sont chargés au démarrage"
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      br_netfilter
      overlay

- name: "Configurer les paramètres sysctl pour Kubernetes au démarrage"
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1

- name: "Appliquer les paramètres sysctl immédiatement"
  command: sysctl --system

- name: "Installation de containerd"
  dnf:
    name: containerd
    state: present

- name: "Créer le répertoire de configuration de containerd"
  file:
    path: "{{ containerd_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "Générer le fichier de configuration de containerd"
  command: "containerd config default > {{ containerd_config_dir }}/{{ containerd_config_file }}"
  args:
    creates: "{{ containerd_config_dir }}/{{ containerd_config_file }}"

- name: "Activer SystemdCgroup dans la configuration de containerd"
  lineinfile:
    path: "{{ containerd_config_dir }}/{{ containerd_config_file }}"
    regexp: 'SystemdCgroup = false'
    line: 'SystemdCgroup = true'

- name: "Démarrer et activer containerd"
  systemd:
    name: containerd
    state: started
    enabled: yes

- name: "Ajouter le dépôt de Kubernetes"
  copy:
    dest: /etc/yum.repos.d/kubernetes.repo
    content: |
      [kubernetes]
      name=Kubernetes
      baseurl=https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/rpm/
      enabled=1
      gpgcheck=1
      repo_gpgcheck=1
      gpgkey=https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/rpm/repodata/repomd.xml.key
      exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni
    owner: root
    group: root
    mode: '0644'

- name: "Installer kubelet, kubeadm et kubectl"
  dnf:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    disable_excludes: kubernetes

- name: "Démarrer et activer kubelet"
  systemd:
    name: kubelet
    state: started
    enabled: yes

# Requis par les playbooks Ansible (kubernetes.core.k8s, kubernetes.core.helm).
- name: "Installer pip"
  dnf:
    name: python3-pip
    state: present

- name: "Installer la bibliothèque Python kubernetes"
  ansible.builtin.pip:
    name: "kubernetes>=28.0.0"
    executable: pip3
    state: present
