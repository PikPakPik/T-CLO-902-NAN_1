---
- name: "[METRICS-SERVER] Appliquer le manifest officiel"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_master_config }}"
    src: "{{ metrics_server_manifest_url }}"
    state: present
    wait: false

- name: "[METRICS-SERVER] Activer --kubelet-insecure-tls (clusters kubeadm)"
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k8s_master_config }}"
    args="$(kubectl get deployment metrics-server -n {{ metrics_server_namespace }} \
      -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null || true)"
    if [[ "$args" != *"kubelet-insecure-tls"* ]]; then
      kubectl patch deployment metrics-server -n {{ metrics_server_namespace }} --type=json -p='[
        {"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}
      ]'
    fi
  args:
    executable: /bin/bash
  register: metrics_server_patch
  changed_when: metrics_server_patch.stdout != ""

- name: "[METRICS-SERVER] Attendre que metrics-server soit Ready"
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k8s_master_config }}"
    kubectl -n {{ metrics_server_namespace }} rollout status deployment/metrics-server --timeout={{ metrics_server_rollout_timeout }}
  args:
    executable: /bin/bash
  changed_when: false

- name: "[METRICS-SERVER] Vérifier que l'API Metrics est disponible"
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k8s_master_config }}"
    for _ in $(seq 1 12); do
      if kubectl top nodes >/dev/null 2>&1; then
        kubectl top nodes
        exit 0
      fi
      sleep 5
    done
    kubectl get apiservice v1beta1.metrics.k8s.io -o yaml
    kubectl -n {{ metrics_server_namespace }} logs deploy/metrics-server --tail=50
    exit 1
  args:
    executable: /bin/bash
  changed_when: false
