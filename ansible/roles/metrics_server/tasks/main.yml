---
- name: "[METRICS-SERVER] Créer le répertoire des manifests sur le master"
  ansible.builtin.file:
    path: /tmp/kubequest/infra/metrics-server
    state: directory
    mode: "0755"

- name: "[METRICS-SERVER] Copier les manifests sur le master (depuis la machine de contrôle)"
  ansible.builtin.copy:
    src: "{{ metrics_server_kustomize_src }}/"
    dest: /tmp/kubequest/infra/metrics-server/
    mode: "0644"
    directory_mode: "0755"

- name: "[METRICS-SERVER] Appliquer le manifest + patch --kubelet-insecure-tls (kustomize)"
  ansible.builtin.shell: |
    set -euo pipefail
    KUBECONFIG="{{ k8s_master_config }}" kubectl apply -k /tmp/kubequest/infra/metrics-server/
  args:
    executable: /bin/bash

- name: "[METRICS-SERVER] Attendre que metrics-server soit Ready"
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k8s_master_config }}"
    kubectl -n {{ metrics_server_namespace }} rollout status deployment/metrics-server --timeout={{ metrics_server_rollout_timeout }}
  args:
    executable: /bin/bash
  changed_when: false

- name: "[METRICS-SERVER] Vérifier que l'API Metrics est disponible"
  ansible.builtin.shell: |
    set -euo pipefail
    export KUBECONFIG="{{ k8s_master_config }}"
    for _ in $(seq 1 12); do
      if kubectl top nodes >/dev/null 2>&1; then
        kubectl top nodes
        exit 0
      fi
      sleep 5
    done
    kubectl get apiservice v1beta1.metrics.k8s.io -o yaml
    kubectl -n {{ metrics_server_namespace }} logs deploy/metrics-server --tail=50
    exit 1
  args:
    executable: /bin/bash
  changed_when: false
