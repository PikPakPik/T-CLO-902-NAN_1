---
- name: "[DEX] Créer le namespace {{ dex_namespace }}"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_master_config }}"
    api_version: v1
    kind: Namespace
    name: "{{ dex_namespace }}"
    state: present

- name: "[DEX] Créer le répertoire des manifests sur le master"
  ansible.builtin.file:
    path: /tmp/kubequest/infra/dex
    state: directory
    mode: "0755"

- name: "[DEX] Copier les manifests Dex sur le master (depuis la machine de contrôle)"
  ansible.builtin.copy:
    src: "{{ dex_kustomize_src }}/"
    dest: /tmp/kubequest/infra/dex/
    mode: "0644"
    directory_mode: "0755"

- name: "[DEX] Appliquer le SealedSecret Dex (avant Helm)"
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_master_config }}"
    src: /tmp/kubequest/infra/dex/dex-sealedsecret.yaml
    state: present

- name: "[DEX] Attendre que le Secret {{ dex_secret_name }} soit déchiffré"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_master_config }}"
    api_version: v1
    kind: Secret
    name: "{{ dex_secret_name }}"
    namespace: "{{ dex_namespace }}"
  register: dex_secret_info
  until: dex_secret_info.resources | default([]) | length > 0
  retries: 12
  delay: 5

- name: "[DEX] Créer le répertoire des values Helm sur le master"
  ansible.builtin.file:
    path: /tmp/kubequest/dex
    state: directory
    mode: "0755"

- name: "[DEX] Générer les values Helm sur le master"
  ansible.builtin.template:
    src: values.yaml.j2
    dest: /tmp/kubequest/dex/values.yaml
    mode: "0644"

- name: "[DEX] Ajouter le repo Helm {{ dex_chart_repo_name }}"
  ansible.builtin.command:
    argv:
      - helm
      - repo
      - add
      - "{{ dex_chart_repo_name }}"
      - "{{ dex_chart_repo_url }}"
  register: dex_helm_repo_add
  failed_when: >-
    dex_helm_repo_add.rc != 0
    and ('already exists' not in (dex_helm_repo_add.stderr | default('')))
  changed_when: "'already exists' not in (dex_helm_repo_add.stderr | default(''))"

- name: "[DEX] Mettre à jour le cache des repos Helm"
  ansible.builtin.command: helm repo update
  changed_when: false

- name: "[DEX] Installer / mettre à jour Dex via Helm"
  kubernetes.core.helm:
    kubeconfig: "{{ k8s_master_config }}"
    name: "{{ dex_release_name }}"
    chart_ref: "{{ dex_chart_repo_name }}/{{ dex_chart_ref }}"
    chart_version: "{{ dex_chart_version }}"
    release_namespace: "{{ dex_namespace }}"
    create_namespace: true
    update_repo_cache: false
    values_files:
      - /tmp/kubequest/dex/values.yaml
    wait: true
    timeout: 5m

- name: "[DEX] Vérifier que les CRDs Gateway API (HTTPRoute) sont installées"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ k8s_master_config }}"
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: httproutes.gateway.networking.k8s.io
  register: dex_httproute_crd
  failed_when: false

- name: "[DEX] Installer les CRDs Gateway API (prérequis HTTPRoute)"
  when: dex_httproute_crd.resources | default([]) | length == 0
  kubernetes.core.k8s:
    kubeconfig: "{{ k8s_master_config }}"
    src: "{{ gateway_api_crds_url }}"
    state: present

- name: "[DEX] Appliquer l'HTTPRoute (Dex)"
  ansible.builtin.shell: |
    set -euo pipefail
    KUBECONFIG="{{ k8s_master_config }}" kubectl apply -k /tmp/kubequest/infra/dex/
  args:
    executable: /bin/bash
