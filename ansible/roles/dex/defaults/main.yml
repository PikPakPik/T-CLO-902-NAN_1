---
# Dex IDP — fournisseur d'identité (OIDC). Étape 1 : comptes locaux uniquement.
# Le connecteur Microsoft Entra ID sera ajouté plus tard, avec cert-manager/TLS.

dex_kustomize_src: "{{ playbook_dir }}/../infra/dex"

dex_namespace: dex
dex_release_name: dex
dex_chart_ref: dex
dex_chart_repo_name: dex
dex_chart_repo_url: https://charts.dexidp.io
# Version épinglée du chart (ajuster si besoin : `helm search repo dex/dex --versions`).
dex_chart_version: "0.23.0"

# Hostnames nip.io — même schéma que monitoring_nip_suffix (roles/monitoring/defaults/main.yml).
dex_nip_suffix: "{{ master_public_ip | replace('.', '-') }}.nip.io"
dex_hostname: "dex.{{ dex_nip_suffix }}"
dex_grafana_redirect_host: "grafana.{{ dex_nip_suffix }}"
dex_headlamp_redirect_host: "headlamp.{{ dex_nip_suffix }}"

# SealedSecret fournissant les valeurs sensibles (hash bcrypt admin, client secrets).
# Injectées dans Dex via envFrom et référencées en $VAR dans la config.
# Génération : procédure de scellement (voir docs/dex.md).
dex_secret_name: dex-secrets

# Compte local administrateur (mapé Admin sur Grafana).
dex_admin_email: admin@kubequest.local
dex_admin_username: admin
# userID stable (ne doit pas changer une fois en place).
dex_admin_user_id: "08a8684b-db88-4b73-90a9-3cd1661f5466"

# Compte local utilisateur simple (mapé Viewer sur Grafana — ne correspond pas à l'email admin).
dex_user_email: user@kubequest.local
dex_user_username: user
dex_user_user_id: "1d2f3a4b-5c6d-4e8f-9a0b-1c2d3e4f5a6b"

# Identifiants des clients OAuth statiques.
dex_grafana_client_id: grafana
dex_headlamp_client_id: headlamp

# Port HTTP servi par Dex (pas de TLS à cette étape).
dex_http_port: 5556
