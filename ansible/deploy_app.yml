---
- name: Vérifier les prérequis locaux
  hosts: localhost
  become: false
  gather_facts: false
  vars:
    ansible_become: false
    values_sealed_file: "{{ playbook_dir }}/../charts/sample-app/values.sealed.yaml"
    gitops_values_file: "{{ playbook_dir }}/../gitops/sample-app/values.yaml"
  tasks:
    - name: "[APP] Vérifier que values.sealed.yaml existe"
      stat:
        path: "{{ values_sealed_file }}"
      register: values_sealed_stat

    - name: "[APP] Erreur si values.sealed.yaml introuvable"
      fail:
        msg: >-
          Le fichier values.sealed.yaml est introuvable : {{ values_sealed_file }}.
          Scellez les secrets applicatifs avec kubeseal en suivant docs/sealed-secrets.md.
      when: not values_sealed_stat.stat.exists

    - name: "[APP] Vérifier que gitops/sample-app/values.yaml existe"
      stat:
        path: "{{ gitops_values_file }}"
      register: gitops_values_stat

    - name: "[APP] Erreur si gitops/sample-app/values.yaml introuvable"
      fail:
        msg: "Le fichier gitops/sample-app/values.yaml est introuvable : {{ gitops_values_file }}"
      when: not gitops_values_stat.stat.exists

- name: Déployer sample-app via Helm
  hosts: master
  vars:
    values_sealed_file: "{{ playbook_dir }}/../charts/sample-app/values.sealed.yaml"
    gitops_values_file: "{{ playbook_dir }}/../gitops/sample-app/values.yaml"
    chart_src: "{{ playbook_dir }}/../charts/sample-app"
    release_name: app
    app_namespace: sample-app
    ghcr_pull_secret_name: ghcr-registry
    k8s_master_config: /etc/kubernetes/admin.conf
    app_secret_name: "{{ release_name }}-sample-app-app-secrets"
    github_user: "{{ lookup('env', 'GITHUB_USER') | default('', true) }}"
    github_token: "{{ lookup('env', 'GITHUB_TOKEN') | default('', true) }}"

  tasks:
    - name: "[APP] Créer le namespace {{ app_namespace }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_master_config }}"
        api_version: v1
        kind: Namespace
        name: "{{ app_namespace }}"
        state: present

    - name: "[APP] Vérifier si le imagePullSecret {{ ghcr_pull_secret_name }} existe"
      kubernetes.core.k8s_info:
        kubeconfig: "{{ k8s_master_config }}"
        api_version: v1
        kind: Secret
        name: "{{ ghcr_pull_secret_name }}"
        namespace: "{{ app_namespace }}"
      register: ghcr_pull_secret
      failed_when: false

    - name: "[APP] Créer / mettre à jour le imagePullSecret GHCR (si credentials fournis)"
      when: github_token | length > 0 and github_user | length > 0
      ansible.builtin.shell: |
        set -euo pipefail
        export KUBECONFIG="{{ k8s_master_config }}"
        kubectl create secret docker-registry {{ ghcr_pull_secret_name }} \
          --docker-server=ghcr.io \
          --docker-username="{{ github_user }}" \
          --docker-password="{{ github_token }}" \
          --namespace="{{ app_namespace }}" \
          --dry-run=client -o yaml | kubectl apply -f -
      args:
        executable: /bin/bash

    - name: "[APP] Erreur si imagePullSecret GHCR absent"
      ansible.builtin.fail:
        msg: >-
          Le secret {{ ghcr_pull_secret_name }} n'existe pas dans {{ app_namespace }}.
          Exportez GITHUB_USER et GITHUB_TOKEN une seule fois pour le créer,
          puis les prochains deploys n'en auront plus besoin.
      when:
        - ghcr_pull_secret.resources | default([]) | length == 0
        - github_token | length == 0 or github_user | length == 0

    - name: "[APP] Copier le chart Helm sur le master"
      ansible.builtin.copy:
        src: "{{ chart_src }}/"
        dest: /tmp/sample-app-chart/
        mode: "0644"
        directory_mode: "0755"

    - name: "[APP] Copier values.sealed.yaml sur le master"
      ansible.builtin.copy:
        src: "{{ values_sealed_file }}"
        dest: /tmp/sample-app-values.sealed.yaml
        mode: "0644"

    - name: "[APP] Copier gitops/sample-app/values.yaml sur le master"
      ansible.builtin.copy:
        src: "{{ gitops_values_file }}"
        dest: /tmp/sample-app-gitops-values.yaml
        mode: "0644"

    - name: "[APP] Déployer sample-app via Helm"
      ansible.builtin.shell: |
        set -euo pipefail
        KUBECONFIG="{{ k8s_master_config }}" \
          helm upgrade --install {{ release_name }} /tmp/sample-app-chart/ \
          --namespace {{ app_namespace }} \
          -f /tmp/sample-app-values.sealed.yaml \
          -f /tmp/sample-app-gitops-values.yaml
      args:
        executable: /bin/bash

    - name: "[APP] Attendre le déchiffrement du SealedSecret"
      ansible.builtin.shell: |
        set -euo pipefail
        for _ in $(seq 1 30); do
          if KUBECONFIG="{{ k8s_master_config }}" \
            kubectl get secret {{ app_secret_name }} -n {{ app_namespace }} >/dev/null 2>&1; then
            exit 0
          fi
          sleep 2
        done
        KUBECONFIG="{{ k8s_master_config }}" \
          kubectl describe sealedsecret {{ app_secret_name }} -n {{ app_namespace }}
        exit 1
      args:
        executable: /bin/bash
      changed_when: false

    - name: "[APP] Vérifier le déploiement"
      ansible.builtin.shell: |
        set -euo pipefail
        if ! KUBECONFIG="{{ k8s_master_config }}" \
          kubectl rollout status deployment/{{ release_name }}-sample-app \
          -n {{ app_namespace }} --timeout=300s; then
          echo "=== Pods sample-app ==="
          KUBECONFIG="{{ k8s_master_config }}" \
            kubectl get pods -n {{ app_namespace }} -l app.kubernetes.io/name=sample-app
          echo "=== Derniers événements ==="
          KUBECONFIG="{{ k8s_master_config }}" \
            kubectl get events -n {{ app_namespace }} --sort-by=.lastTimestamp | tail -15
          failing_pod="$(KUBECONFIG="{{ k8s_master_config }}" \
            kubectl get pods -n {{ app_namespace }} -l app.kubernetes.io/name=sample-app \
            -o jsonpath='{range .items[?(@.status.phase!="Running")]}{.metadata.name}{"\n"}{end}' \
            | head -1)"
          if [ -n "$failing_pod" ]; then
            echo "=== Describe $failing_pod ==="
            KUBECONFIG="{{ k8s_master_config }}" \
              kubectl describe pod "$failing_pod" -n {{ app_namespace }} | tail -25
          fi
          exit 1
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: "[APP] Supprimer les fichiers temporaires du master"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/sample-app-chart
        - /tmp/sample-app-values.sealed.yaml
        - /tmp/sample-app-gitops-values.yaml
