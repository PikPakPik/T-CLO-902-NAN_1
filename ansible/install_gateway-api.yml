---
- name: Install Gateway API and Envoy Gateway
  hosts: k8s_master
  become: yes
  tasks:
    # CRDs Gateway API standard (avant le chart Envoy Gateway).
    - name: Install Gateway API CRDs
      kubernetes.core.k8s:
        kubeconfig: "{{ k8s_master_config }}"
        src: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.0/standard-install.yaml
        state: present

    # Chart publié en OCI sur Docker Hub (l’ancien repo HTTPS github.io renvoie 404).
    - name: Install Envoy Gateway
      kubernetes.core.helm:
        kubeconfig: "{{ k8s_master_config }}"
        name: envoy-gateway
        chart_ref: oci://docker.io/envoyproxy/gateway-helm
        release_namespace: envoy-gateway-system
        create_namespace: yes
        chart_version: v1.7.1

    - name: Copy Gateway manifests to master
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../infra/gateway/"
        dest: /tmp/kubequest/infra/gateway/
        mode: "0644"
        directory_mode: "0755"

    - name: Apply Gateway (NLB public + ReferenceGrant cross-namespace)
      ansible.builtin.shell: |
        set -euo pipefail
        KUBECONFIG="{{ k8s_master_config }}" kubectl apply -k /tmp/kubequest/infra/gateway/
      args:
        executable: /bin/bash
