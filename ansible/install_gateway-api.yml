---
- name: Install Gateway API and Envoy Gateway
  hosts: k8s_master
  become: yes
  tasks:
    # Une seule commande : en v1.8.0 le chart gateway-helm embarque TOUS les CRDs
    # (Gateway API + Envoy Gateway) dans crds/.
    # Équivalent CLI : helm install eg oci://docker.io/envoyproxy/gateway-helm --version v1.8.0 -n envoy-gateway-system --create-namespace
    # Versions : https://hub.docker.com/r/envoyproxy/gateway-helm/tags
    # Ref: https://gateway.envoyproxy.io/docs/install/install-helm/
    - name: Install Envoy Gateway (includes all CRDs)
      kubernetes.core.helm:
        kubeconfig: '{{ k8s_master_config }}'
        name: envoy-gateway
        chart_ref: oci://docker.io/envoyproxy/gateway-helm
        release_namespace: envoy-gateway-system
        create_namespace: yes
        chart_version: v1.8.0
        wait: yes
        wait_timeout: 5m

    - name: Wait for envoy-gateway controller Deployment ready
      shell: |
        export KUBECONFIG={{ k8s_master_config }}
        kubectl -n envoy-gateway-system rollout status deploy/envoy-gateway --timeout=180s
      args:
        executable: /bin/bash
      changed_when: false

    # Note : La création du GatewayClass et du Gateway public est gérée par
    # le playbook séparé `deploy_gateway.yml` (séparation infra vs config).
    # Ce playbook se limite à installer les CRDs + le contrôleur Envoy Gateway.
