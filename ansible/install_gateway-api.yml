---
- name: Install Gateway API and Envoy Gateway
  hosts: k8s_master
  become: yes
  tasks:
    - name: Install Gateway API CRDs
      kubernetes.core.k8s:
        src: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.5.0/standard-install.yaml
        state: present

    - name: Add Envoy Gateway Helm repo
      community.kubernetes.helm_repository:
        name: envoy-gateway
        repo_url: 'https://envoyproxy.github.io/gateway-helm'

    - name: Install Envoy Gateway
      community.kubernetes.helm:
        name: envoy-gateway
        chart_ref: envoy-gateway/envoy-gateway
        release_namespace: envoy-gateway-system
        create_namespace: yes
        version: v1.7.1
