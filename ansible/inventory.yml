---
all:
  vars:
    ansible_user: ec2-user
    ansible_become: yes
    ansible_become_method: sudo
    ansible_become_user: root
    ansible_ssh_private_key_file: ~/.ssh/kubequest.pem
    
  children:
    k8s_master:
      hosts:
        master:
          ansible_host: 15.237.15.14
          internal_ip: 10.0.3.214
          
    k8s_workers:
      hosts:
        worker1:
          ansible_host: 10.0.3.198
          ansible_ssh_common_args: '-o ProxyCommand="ssh -i ~/.ssh/kubequest.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ec2-user@15.237.15.14"'
          
        worker2:
          ansible_host: 10.0.3.187
          ansible_ssh_common_args: '-o ProxyCommand="ssh -i ~/.ssh/kubequest.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ec2-user@15.237.15.14"'
          
        worker3:
          ansible_host: 10.0.3.77
          ansible_ssh_common_args: '-o ProxyCommand="ssh -i ~/.ssh/kubequest.pem -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -W %h:%p ec2-user@15.237.15.14"'

    k8s_cluster:
      children:
        k8s_master:
        k8s_workers:
